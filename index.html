<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planner</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="auth" class="card">
    <h2>Planner</h2>
    <form id="login">
      <p class="muted">Enter your email and we'll send you a sign-in link.</p>
      <div class="add"><input type="email" name="email" required placeholder="you@example.com"><button class="primary">Send link</button></div>
      <p id="authMsg" class="muted"></p>
    </form>
  </div>

  <header>
    <nav class="views">
      <button data-view="day">Day</button><button data-view="week">Week</button><button data-view="month">Month</button><button id="listsBtn">Lists</button>
    </nav>
    <div class="nav">
      <button id="prev" aria-label="Previous">‹</button><button id="todayBtn">Today</button><button id="next" aria-label="Next">›</button>
      <h1 id="title"></h1>
      <input type="date" id="date" aria-label="Go to date">
    </div>
    <button id="signout">Sign out</button>
  </header>

  <div class="layout">
    <main id="main"></main>
    <aside id="lists"></aside>
  </div>

  <dialog id="dlg"></dialog>
</body>
</html>
