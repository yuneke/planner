<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0D12">
  <title>Planner</title>
  <link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body class="view-day">
  <div id="auth">
    <div class="card">
      <p class="brand">Planner</p>
      <form id="login">
        <div class="stack">
          <input type="email" name="email" required placeholder="you@example.com" autocomplete="email" aria-label="Email">
          <input type="password" name="password" required minlength="6" placeholder="Password" autocomplete="current-password" aria-label="Password">
          <div class="add"><button class="primary" value="in">Sign in</button><button value="up">Create account</button></div>
        </div>
        <p id="authMsg" class="muted" role="status"></p>
      </form>
    </div>
  </div>

  <header>
    <nav class="views" aria-label="Views">
      <button data-view="day" data-icon="day">Day</button>
      <button data-view="week" data-icon="week">Week</button>
      <button data-view="month" data-icon="month">Month</button>
      <button id="listsBtn" data-icon="list">Lists</button>
    </nav>
    <div class="nav">
      <button id="prev" class="icon" data-icon="left" aria-label="Previous"></button>
      <button id="todayBtn" class="ghost">Current</button>
      <button id="next" class="icon" data-icon="right" aria-label="Next"></button>
      <h1 id="title"></h1>
      <input type="date" id="date" aria-label="Go to date">
    </div>
    <button id="signout" class="icon" data-icon="out" aria-label="Sign out" title="Sign out"></button>
  </header>

  <div class="layout">
    <main id="main"></main>
    <aside id="lists" aria-label="Inbox and periods"></aside>
  </div>

  <dialog id="dlg"></dialog>
</body>
</html>
