<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0D12">
  <title>Planner</title>
  <link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body class="view-day">
  <div id="auth">
    <div class="card">
      <p class="brand">Planner</p>
      <p id="authLead" class="muted">Welcome back.</p>
      <button type="button" id="github" class="github" data-icon="github" data-modes="in up">Continue with GitHub</button>
      <p class="or" data-modes="in up"><span>or</span></p>
      <form id="login" data-mode="in">
        <label class="field" data-modes="in"><span>Email or username</span><input name="login" required autocomplete="username"></label>
        <label class="field" data-modes="up forgot"><span>Email</span><input type="email" name="email" required autocomplete="email"></label>
        <label class="field" data-modes="up"><span>Username</span><input name="username" required pattern="[A-Za-z0-9_]{3,20}" title="3–20 letters, numbers or _" autocomplete="username"></label>
        <label class="field" data-modes="in up"><span>Password</span><input type="password" name="password" required minlength="6" autocomplete="current-password"></label>
        <button class="primary" id="authGo">Sign in</button>
        <p id="authMsg" role="status"></p>
      </form>
      <p class="switch">
        <button type="button" class="link" data-to="forgot" data-modes="in">Forgot password?</button>
        <button type="button" class="link" data-to="up" data-modes="in">Create account</button>
        <button type="button" class="link" data-to="in" data-modes="up forgot">Back to sign in</button>
      </p>
    </div>
  </div>

  <header>
    <nav class="views" aria-label="Views">
      <button data-view="day" data-icon="day">Day</button>
      <button data-view="week" data-icon="week">Week</button>
      <button data-view="month" data-icon="month">Month</button>
      <button id="listsBtn" data-icon="list">Lists</button>
    </nav>
    <div class="nav">
      <button id="prev" class="icon" data-icon="left" aria-label="Previous"></button>
      <button id="todayBtn" class="ghost">Current</button>
      <button id="next" class="icon" data-icon="right" aria-label="Next"></button>
      <h1 id="title"></h1>
      <input type="date" id="date" aria-label="Go to date">
    </div>
    <button id="signout" class="icon" data-icon="out" aria-label="Sign out" title="Sign out"></button>
  </header>

  <div class="layout">
    <main id="main"></main>
    <aside id="lists" aria-label="Inbox and periods"></aside>
  </div>

  <dialog id="dlg"></dialog>
</body>
</html>
